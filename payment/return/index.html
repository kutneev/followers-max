<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Ваш заказ — Realbuzz</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/payment-return.css">
  <script src="/payment-return.js" defer></script>
</head>
<body class="payment-return-page">
  <main class="payment-return-shell">
    <a class="payment-return-brand" href="/">realbuzz</a>
    <section class="payment-return-card" data-payment-return data-prefix="RB" data-clarity-mask="true">
      <div role="status" aria-live="polite">
        <h1 data-heading>Проверяем ваш заказ</h1>
        <p data-message>Если вы уже оплатили заказ, повторно платить не нужно.</p>
      </div>
      <p data-reference></p>
      <dl class="payment-return-summary" data-summary hidden>
        <div><dt>Номер заказа</dt><dd data-order-id></dd></div>
        <div><dt>Пакет</dt><dd data-plan></dd></div>
        <div><dt data-amount-label>Сумма заказа</dt><dd data-amount></dd></div>
      </dl>
      <button type="button" data-refresh hidden>Проверить статус</button>
      <p>Есть вопросы? <a href="https://t.me/Savkin_1337" rel="noopener noreferrer" target="_blank">Напишите нам в Telegram</a>.</p>
      <a class="payment-return-home" href="/">На главную</a>
      <noscript><p>Для автоматической проверки включите JavaScript. Если вы уже оплатили заказ, повторно платить не нужно.</p></noscript>
    </section>
  </main>
</body>
</html>
